      <stop offset="0" stop-color="#8E1520"/>
      <stop offset="0.5" stop-color="#C8303A"/>
      <stop offset="1" stop-color="#8E1520"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.38" cy="0.32" r="0.8">
